name: Phase 2 source probe

on:
  push:
    branches:
      - phase2/living-actors
    paths:
      - '.github/workflows/phase2-source-probe.yml'
      - 'tools/blender-source-inspect.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install source inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender p7zip-full

      - name: Acquire exact CC0 candidate sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/lf-phase2-sources
          cd /tmp/lf-phase2-sources
          curl -fL --retry 3 --retry-delay 2 -o wolf.zip 'https://opengameart.org/sites/default/files/Animal%20Pack%20Vol.2%20by%20%40Quaternius.zip'
          curl -fL --retry 3 --retry-delay 2 -o humans.zip 'https://opengameart.org/sites/default/files/ultimate_animated_character_pack_by_quaternius.zip'
          curl -fL --retry 3 --retry-delay 2 -o rabbit.blend 'https://opengameart.org/sites/default/files/rabbit.blend'
          curl -fL --retry 3 --retry-delay 2 -o boar.blend 'https://opengameart.org/sites/default/files/boar_0.blend'
          sha256sum wolf.zip humans.zip rabbit.blend boar.blend | tee source.sha256

      - name: Preserve untouched source candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/lf-phase2-sources
          if ! gh release view phase2-source-archives --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create phase2-source-archives --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Phase 2 source archives" --notes "Untouched candidate source downloads for the Living Frontier Phase 2 living-actor pipeline. Promotion still requires inspection, conversion, validation and live-game visual acceptance."
          fi
          gh release upload phase2-source-archives wolf.zip humans.zip rabbit.blend boar.blend --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Extract and inventory archives
        run: |
          set -euo pipefail
          cd /tmp/lf-phase2-sources
          mkdir wolf humans
          unzip -q wolf.zip -d wolf
          unzip -q humans.zip -d humans
          find wolf -type f -printf '%P\n' | sort > wolf-files.txt
          find humans -type f -printf '%P\n' | sort > human-files.txt
          echo '=== WOLF FILES ==='
          cat wolf-files.txt
          echo '=== HUMAN FILES ==='
          cat human-files.txt

      - name: Inspect Blender source semantics
        run: |
          set -euo pipefail
          mkdir -p /tmp/lf-phase2-sources/inspection
          blender --background /tmp/lf-phase2-sources/rabbit.blend --python "$GITHUB_WORKSPACE/tools/blender-source-inspect.py" -- rabbit /tmp/lf-phase2-sources/inspection/rabbit.json
          blender --background /tmp/lf-phase2-sources/boar.blend --python "$GITHUB_WORKSPACE/tools/blender-source-inspect.py" -- boar /tmp/lf-phase2-sources/inspection/boar.json
          WOLF_BLEND="$(find /tmp/lf-phase2-sources/wolf -type f -iname '*wolf*.blend' | head -n1 || true)"
          if [ -n "$WOLF_BLEND" ]; then
            blender --background "$WOLF_BLEND" --python "$GITHUB_WORKSPACE/tools/blender-source-inspect.py" -- wolf /tmp/lf-phase2-sources/inspection/wolf.json
          else
            printf '{"label":"wolf","sourceFile":null,"objects":[],"armatures":[],"actions":[],"images":[],"note":"No Wolf-named Blend file found; inspect archive inventory before conversion."}\n' > /tmp/lf-phase2-sources/inspection/wolf.json
          fi

      - name: Capture source-page evidence
        run: |
          set -euo pipefail
          mkdir -p docs/resources/evidence/phase2
          curl -fsSL 'https://opengameart.org/content/animated-animales-low-poly' -o docs/resources/evidence/phase2/quaternius-animated-animals.html
          curl -fsSL 'https://opengameart.org/content/animated-characters-pack' -o docs/resources/evidence/phase2/quaternius-animated-characters.html
          curl -fsSL 'https://opengameart.org/content/rabbit-0' -o docs/resources/evidence/phase2/cdmir-rabbit.html
          curl -fsSL 'https://opengameart.org/content/boar' -o docs/resources/evidence/phase2/teh-bucket-boar.html

      - name: Build deterministic source probe record
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const base = '/tmp/lf-phase2-sources';
          const hash = (name) => crypto.createHash('sha256').update(fs.readFileSync(base + '/' + name)).digest('hex');
          const lines = (name) => fs.readFileSync(base + '/' + name, 'utf8').split(/\r?\n/).filter(Boolean);
          const readJson = (name) => JSON.parse(fs.readFileSync(base + '/inspection/' + name + '.json', 'utf8'));
          const record = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            candidates: {
              wolf: {
                sourcePage: 'https://opengameart.org/content/animated-animales-low-poly',
                acquisitionUrl: 'https://opengameart.org/sites/default/files/Animal%20Pack%20Vol.2%20by%20%40Quaternius.zip',
                creator: 'quaternius',
                license: 'CC0-1.0',
                sha256: hash('wolf.zip'),
                inventory: lines('wolf-files.txt'),
                inspection: readJson('wolf'),
              },
              humans: {
                sourcePage: 'https://opengameart.org/content/animated-characters-pack',
                acquisitionUrl: 'https://opengameart.org/sites/default/files/ultimate_animated_character_pack_by_quaternius.zip',
                creator: 'quaternius',
                license: 'CC0-1.0',
                sha256: hash('humans.zip'),
                inventory: lines('human-files.txt'),
              },
              rabbit: {
                sourcePage: 'https://opengameart.org/content/rabbit-0',
                acquisitionUrl: 'https://opengameart.org/sites/default/files/rabbit.blend',
                creator: 'CDmir / TinyWorlds',
                license: 'CC0-1.0',
                sha256: hash('rabbit.blend'),
                inspection: readJson('rabbit'),
              },
              boar: {
                sourcePage: 'https://opengameart.org/content/boar',
                acquisitionUrl: 'https://opengameart.org/sites/default/files/boar_0.blend',
                creator: 'Teh_Bucket',
                license: 'CC0-1.0',
                sha256: hash('boar.blend'),
                inspection: readJson('boar'),
              },
            },
          };
          fs.mkdirSync('docs/phase2', { recursive: true });
          fs.writeFileSync('docs/phase2/SOURCE_PROBE.json', JSON.stringify(record, null, 2) + '\n');
          NODE

      - name: Commit inspected source evidence
        run: |
          set -euo pipefail
          git config user.name "living-frontier-source-probe"
          git config user.email "actions@users.noreply.github.com"
          git add docs/phase2/SOURCE_PROBE.json docs/resources/evidence/phase2
          if git diff --cached --quiet; then
            echo "No source-probe evidence changed."
          else
            git commit -m "Record inspected Phase 2 source candidates"
            git push origin HEAD:phase2/living-actors
          fi

      - name: Upload source inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-source-probe
          path: |
            /tmp/lf-phase2-sources/source.sha256
            /tmp/lf-phase2-sources/wolf-files.txt
            /tmp/lf-phase2-sources/human-files.txt
            /tmp/lf-phase2-sources/inspection/*.json
          if-no-files-found: error
